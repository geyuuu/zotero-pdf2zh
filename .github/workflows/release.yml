name: Release

on:
  push:
    tags:
      - 'v**'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # 使用 PAT（存为仓库 secret RELEASE_TOKEN）而不是自动的 GITHUB_TOKEN，
      # 因为 fork 仓库的 GITHUB_TOKEN 即使设了 Read/Write 也常常无法创建 Release。
      # scaffold 和后面的 gh 命令都读取这个环境变量。
      GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # zotero-plugin-scaffold 需要 Node >= 22.8
          node-version: 22

      - name: Install deps
        run: cd plugin/ && npm install

      - name: Build
        run: |
          cd plugin/ && npm run build

      - name: Release plugin to GitHub
        run: |
          cd plugin/ && npm run release
          sleep 1s

      # ------------------- 现打包 server/ 并上传 -------------------
      - name: Zip server dir and upload to Release
        # 现场把仓库根目录的 server/ 打包成 server.zip（CI checkout 只含被跟踪文件，
        # 被 .gitignore 忽略的 config.json / venv 等不会进包），再上传到 scaffold
        # 刚创建的 Release。Release 名按 package.json 版本推导（scaffold 用 v%s），
        # 这样即使触发的 git tag 名和版本号写法不同也能对上。
        run: |
          rm -f server.zip
          zip -r server.zip server
          VERSION=$(node -p "require('./plugin/package.json').version")
          gh release upload "v$VERSION" server.zip --clobber
      # ----------------------------------------------------

      - name: Notify release
        uses: apexskier/github-release-commenter@v1
        continue-on-error: true
        with:
          # 这个 action 也需要 GITHUB_TOKEN，但我们已经在 job 级别设置了 env
          # GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # (可选，因为已在 job env 中定义)
          comment-template: |
            :rocket: _This ticket has been resolved in {release_tag}. See {release_link} for release notes._